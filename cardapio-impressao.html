<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beach Burguer | Cardápio Editável</title><link rel="icon" href="/assets/logo.png"><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:50;background:#050505;border-bottom:1px solid #333;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar a{border:0;border-radius:9px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.yellow{background:#ffb600;color:#111}.dark{background:#292929;color:#fff}.green{background:#198754;color:#fff}.hint{color:#bbb;font-size:13px}.pages{padding:20px}.page{width:min(210mm,100%);aspect-ratio:1131/1600;margin:0 auto 24px;position:relative;overflow:hidden;box-shadow:0 8px 30px #000;border:1px solid #252525;background:#080808 url('/assets/cardapio-artesanal-fundo.png') center/100% 100% no-repeat}.page-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none;user-select:none}.page .head{position:absolute;inset:0;pointer-events:none}.page .title{display:none}.art-page::before{content:'CARDÁPIO\A DE\A LANCHES';white-space:pre;position:absolute;z-index:3;left:5.7%;top:5.2%;width:27%;height:10.5%;background:#ffb600;color:#080808;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:1000;font-size:clamp(15px,1.65vw,25px);line-height:1.18;transform:rotate(-8deg);transform-origin:center;box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}.page .logo-wrap{display:none}.items{position:absolute;z-index:4}.art-page .items{left:4.5%;right:4.5%;top:24.0%;bottom:11.8%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,minmax(0,1fr));grid-auto-flow:column;column-gap:9.5%;row-gap:0}.item{position:relative;text-align:center;display:flex;flex-direction:column;justify-content:center;padding:1% 2%}.art-page .item{padding:1% 25% 1% 1.5%;min-width:0;overflow:visible}.art-page .name,.art-page .desc{width:100%;margin-left:0;margin-right:0}.name{color:#ffb600;font-weight:900;font-size:clamp(12px,1.32vw,20px);text-transform:uppercase;line-height:1.02;text-shadow:0 1px 1px #000}.desc{font-size:clamp(9px,1.04vw,16.5px);font-weight:500;line-height:1.08;white-space:pre-line;margin-top:1.2%;text-shadow:0 1px 1px #000;overflow-wrap:normal;word-break:normal}.price{position:absolute;right:1.5%;top:31%;font-size:clamp(11px,1.27vw,19px);font-weight:500;transform:rotate(-20deg);white-space:nowrap;text-shadow:0 1px 1px #000;z-index:6;pointer-events:none}.art-page .item:nth-child(n+6) .price{right:1.5%}.edit{position:absolute;z-index:15;left:2%;right:2%;top:4%;background:rgba(15,15,15,.97);border:1px solid #666;border-radius:6px;padding:6px;text-align:left}.edit label{font-size:10px;color:#bbb}.edit input,.edit textarea{width:100%;background:#202020;color:#fff;border:1px solid #666;border-radius:4px;padding:4px;margin:2px 0}.edit textarea{height:42px;resize:vertical}.foot,.contact{display:none}.other-page .category-title{position:absolute;z-index:5;left:5.5%;top:5.3%;width:29%;min-height:10%;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);font-weight:1000;color:#080808;font-size:clamp(16px,2vw,30px);text-transform:uppercase;line-height:1.05}.other-page .items{left:6%;right:6%;top:25%;bottom:10%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(17%,auto);gap:2% 9%;align-content:start}.other-page .item{min-height:105px}.other-page .price{position:static;transform:none;margin-top:2%;font-weight:800}.savebar{text-align:center;margin:10px}.empty{text-align:center;color:#aaa;padding:50px}.hidden{display:none!important}
@media(max-width:700px){.pages{padding:8px}.page{width:100%;min-width:0}.art-page .items{left:4%;right:4%;top:24%;bottom:11.8%}.item{padding:1% 1%}.art-page .item{padding:1% 25% 1% 1.5%}.art-page .name,.art-page .desc{width:100%;margin-left:0;margin-right:0}.name{font-size:1.82vw}.desc{font-size:1.46vw}.price{font-size:1.70vw;right:1.5%;top:31%}.edit{font-size:10px}.edit textarea{height:35px}}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{background:#fff}.toolbar,.edit,.savebar{display:none!important}.pages{padding:0}.page{width:210mm;height:297mm;aspect-ratio:auto;margin:0;border:0;box-shadow:none;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}}
</style></head><body>
<div class="toolbar"><a class="dark" href="/loja">← Pedidos</a><button class="yellow" onclick="window.print()">🖨️ Imprimir / PDF</button><button id="editar" class="dark">✏️ Editar cardápio</button><button id="salvar" class="green hidden">💾 Salvar alterações</button><span class="hint">O cardápio artesanal usa o mesmo fundo do modelo original; as demais categorias ficam em páginas separadas com o mesmo visual.</span></div>
<main id="pages" class="pages"><div class="empty">Carregando cardápio...</div></main>
<script>
const TK='bb_store_token';let catalog=[],categories=[],editing=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
function isArtesanal(cat){return /artes|tem[aá]tico|lanche/i.test(cat)&&!/tradicional|podr[aã]o|misto|combo|bebida|adicional/i.test(cat)}
function itemHTML(p){return `<article class="item" data-id="${p.id}"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'')}</div><div class="price">${money(p.price)}</div><div class="edit ${editing?'':'hidden'}"><label>Nome<input class="e-name" value="${esc(p.name)}"></label><label>Descrição / ingredientes<textarea class="e-desc">${esc(p.description||'')}</textarea></label><label>Preço (R$)<input class="e-price" type="number" step="0.01" min="0" value="${Number(p.price||0).toFixed(2)}"></label></div></article>`}
function render(){const active=catalog.filter(x=>x.active!==false);const order=[...new Set(active.map(x=>x.category))];order.sort((a,b)=>(isArtesanal(b)?1:0)-(isArtesanal(a)?1:0));document.getElementById('pages').innerHTML=order.map(cat=>{let items=active.filter(x=>x.category===cat);const art=isArtesanal(cat);if(art){const wanted=['AÇU','SJB','IQUIPARI','GRUSSAÍ','CHAPÉU DO SOL','BALNEÁRIO','DUNAS','PONTAL','ATAFONA','BEACH BURGUER'];items.sort((a,b)=>{const na=String(a.name).toUpperCase(),nb=String(b.name).toUpperCase();let ia=wanted.findIndex(x=>na.includes(x)),ib=wanted.findIndex(x=>nb.includes(x));if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib})}return `<section class="page ${art?'art-page':'other-page'}"><img class="page-bg" src="/assets/cardapio-artesanal-fundo.png" alt="">${art?'':`<div class="category-title">${esc(cat)}</div>`}<div class="items">${items.map(itemHTML).join('')}</div></section>`}).join('')||'<div class="empty">Nenhum item ativo no cardápio.</div>'}
async function load(){const r=await fetch('/api/orders?catalog=1',{cache:'no-store'});const d=await r.json();catalog=d.catalog||[];categories=d.categories||[];render()}
document.getElementById('editar').onclick=()=>{editing=!editing;document.getElementById('salvar').classList.toggle('hidden',!editing);document.getElementById('editar').textContent=editing?'Cancelar edição':'✏️ Editar cardápio';render()};
document.getElementById('salvar').onclick=async()=>{const token=localStorage.getItem(TK)||prompt('Informe a senha/token da loja:')||'';const products=[];document.querySelectorAll('.item').forEach(el=>{const p=catalog.find(x=>Number(x.id)===Number(el.dataset.id));products.push({...p,name:el.querySelector('.e-name').value.trim(),description:el.querySelector('.e-desc').value.trim(),price:Number(el.querySelector('.e-price').value||0)})});const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','X-Store-Token':token},body:JSON.stringify({action:'save_catalog',products})});const d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'Não foi possível salvar.');localStorage.setItem(TK,token);catalog=products;editing=false;document.getElementById('salvar').classList.add('hidden');document.getElementById('editar').textContent='✏️ Editar cardápio';render();alert('Cardápio atualizado. As alterações também passam a valer no catálogo do sistema.')};load().catch(()=>document.getElementById('pages').innerHTML='<div class="empty">Não foi possível carregar o cardápio.</div>');
</script></body></html>
