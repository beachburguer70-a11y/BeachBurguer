<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cardápio Beach Burguer</title><style>body{font-family:Arial;margin:28px;color:#111}header{text-align:center;border-bottom:3px solid #111}section{break-inside:avoid;margin:20px 0}h2{background:#111;color:#fff;padding:7px}.item{display:flex;justify-content:space-between;border-bottom:1px dotted #999;padding:8px 0}.desc{font-size:12px;color:#555}@media print{button{display:none}body{margin:10mm}}</style></head><body><header><h1>BEACH BURGUER</h1><p>Cardápio</p><button onclick="print()">🖨️ Imprimir</button></header><main id="menu">Carregando...</main><script>fetch('/api/orders?catalog=1').then(r=>r.json()).then(d=>{const list=d.catalog||d.products||[];const groups={};list.filter(x=>x.active!==false&&x.available!==false).forEach(x=>(groups[x.category]??=[]).push(x));document.getElementById('menu').innerHTML=Object.entries(groups).map(([c,a])=>`<section><h2>${c}</h2>${a.map(p=>`<div class="item"><div><strong>${p.name}</strong><div class="desc">${p.description||''}</div></div><strong>R$ ${Number(p.price||0).toFixed(2).replace('.',',')}</strong></div>`).join('')}</section>`).join('')}).catch(()=>document.getElementById('menu').textContent='Não foi possível carregar o cardápio.')</script></body></html>
