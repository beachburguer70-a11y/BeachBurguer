<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beach Burguer | Cardápio Editável</title><link rel="icon" href="/assets/logo.png"><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:30;background:#050505;border-bottom:1px solid #333;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar a{border:0;border-radius:9px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.yellow{background:#ffb600;color:#111}.dark{background:#292929;color:#fff}.green{background:#198754;color:#fff}.hint{color:#bbb;font-size:13px}.pages{padding:20px}.page{width:min(210mm,100%);height:297mm;margin:0 auto 24px;background:#0b0b0b;position:relative;overflow:hidden;padding:20mm 13mm 22mm;box-shadow:0 8px 30px #000;border:1px solid #252525}.page:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 12% 30%,rgba(255,255,255,.035),transparent 27%),radial-gradient(ellipse at 83% 12%,rgba(255,183,0,.07),transparent 25%),linear-gradient(108deg,transparent 0 34%,rgba(255,255,255,.018) 35% 38%,transparent 39% 100%);pointer-events:none}.page:after{content:"";position:absolute;left:-3%;right:-3%;bottom:0;height:22mm;background:linear-gradient(175deg,#e81608 0 31%,#ffb600 32% 100%);clip-path:polygon(0 34%,23% 24%,45% 40%,69% 18%,100% 31%,100% 100%,0 100%)}.head{height:42mm;position:relative;margin-bottom:2mm}.title{position:absolute;left:0;top:2mm;width:69mm;background:#ffb600;color:#080808;font-size:24px;line-height:1.12;font-weight:1000;padding:7mm 6mm;text-align:center;transform:rotate(-8deg);text-transform:uppercase;letter-spacing:.2px}.logo-wrap{position:absolute;right:8mm;top:-7mm;text-align:center}.logo{width:38mm;height:38mm;object-fit:contain}.brand-text{color:#ffb600;font-family:Georgia,serif;font-size:16px;margin-top:-5px}.items{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;column-gap:17mm;row-gap:2.8mm}.item{position:relative;text-align:center;min-height:36mm;padding:1mm 1mm}.name{color:#ffb600;font-weight:1000;font-size:19px;text-transform:uppercase;line-height:1.05}.desc{font-size:15.5px;line-height:1.08;white-space:pre-line;margin:2mm 4mm 0}.price{position:absolute;right:-9mm;top:4mm;font-size:19px;font-weight:500;transform:rotate(-22deg);white-space:nowrap}.item:nth-child(odd) .price{right:-6mm}.art-page .items{grid-auto-flow:column;grid-template-rows:repeat(5,1fr);grid-template-columns:1fr 1fr;height:183mm;row-gap:0}.art-page .item{min-height:0;display:flex;flex-direction:column;justify-content:center}.art-page .item:nth-child(n+6) .price{right:-8mm}.edit{position:relative;z-index:12;margin-top:2mm;padding:5px;background:#151515;border:1px dashed #666;text-align:left}.edit label{font-size:10px;color:#bbb}.edit input,.edit textarea{width:100%;background:#202020;color:#fff;border:1px solid #666;border-radius:4px;padding:4px;margin:2px 0}.edit textarea{height:40px}.foot{position:absolute;z-index:4;left:10mm;bottom:23mm;font-size:15px}.contact{position:absolute;z-index:5;bottom:7mm;left:11mm;right:11mm;display:flex;justify-content:space-between;color:#fff;font-size:17px;font-weight:800}.contact b{color:#fff}.category-sub{position:relative;z-index:2;text-align:center;color:#ffb600;font-weight:900;font-size:22px;text-transform:uppercase;margin:-8mm 0 8mm}.other-page .items{grid-template-columns:1fr 1fr;gap:10mm 14mm}.other-page .item{min-height:34mm}.other-page .price{position:static;transform:none;margin-top:2mm}.savebar{text-align:center;margin:10px}.empty{text-align:center;color:#aaa;padding:50px}.hidden{display:none!important}@media(max-width:700px){.pages{padding:8px}.page{width:100%;height:auto;min-height:1100px;padding:70px 18px 100px}.head{height:150px}.title{width:230px;font-size:20px;padding:22px 15px}.logo{width:105px;height:105px}.art-page .items{display:grid;grid-auto-flow:row;grid-template-rows:none;grid-template-columns:1fr 1fr;height:auto;gap:12px}.item{min-height:125px}.name{font-size:17px}.desc{font-size:13px}.price{font-size:16px;right:-3px!important}.contact{font-size:13px}}@media print{body{background:#fff}.toolbar,.edit,.savebar{display:none!important}.pages{padding:0}.page{width:210mm;height:297mm;margin:0;border:0;box-shadow:none;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}}
</style></head><body><div class="toolbar"><a class="dark" href="/loja">← Pedidos</a><button class="yellow" onclick="window.print()">🖨️ Imprimir / PDF</button><button id="editar" class="dark">✏️ Editar cardápio</button><button id="salvar" class="green hidden">💾 Salvar alterações</button><span class="hint">Artesanais ficam em uma página própria; as demais categorias são separadas mantendo o mesmo visual.</span></div><main id="pages" class="pages"><div class="empty">Carregando cardápio...</div></main><script>
const TK='bb_store_token';let catalog=[],categories=[],editing=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
function isArtesanal(cat){return /artes|tem[aá]tico|lanche/i.test(cat)&&!/tradicional|podr[aã]o|misto|combo|bebida/i.test(cat)}
function render(){const active=catalog.filter(x=>x.active!==false);const order=[...new Set(active.map(x=>x.category))];order.sort((a,b)=>(isArtesanal(b)?1:0)-(isArtesanal(a)?1:0));document.getElementById('pages').innerHTML=order.map(cat=>{let items=active.filter(x=>x.category===cat);const art=isArtesanal(cat);if(art){const wanted=['AÇU','SJB','IQUIPARI','GRUSSAÍ','CHAPÉU DO SOL','BALNEÁRIO','DUNAS','PONTAL','ATAFONA','BEACH BURGUER'];items.sort((a,b)=>{const na=String(a.name).toUpperCase(),nb=String(b.name).toUpperCase();let ia=wanted.findIndex(x=>na.includes(x)),ib=wanted.findIndex(x=>nb.includes(x));if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib})}return `<section class="page ${art?'art-page':'other-page'}"><div class="head"><div class="title">${art?'CARDÁPIO<br>DE<br>LANCHES':esc(cat)}</div><div class="logo-wrap"><img class="logo" src="/assets/logo.png"><div class="brand-text">Beach Burguer</div></div></div>${art?'':`<div class="category-sub">${esc(cat)}</div>`}<div class="items">${items.map(p=>`<article class="item" data-id="${p.id}"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'')}</div><div class="price">${money(p.price)}</div><div class="edit ${editing?'':'hidden'}"><label>Nome<input class="e-name" value="${esc(p.name)}"></label><label>Descrição / ingredientes<textarea class="e-desc">${esc(p.description||'')}</textarea></label><label>Preço (R$)<input class="e-price" type="number" step="0.01" min="0" value="${Number(p.price||0).toFixed(2)}"></label></div></article>`).join('')}</div>${art?'<div class="foot">Todos os lanches acompanham fritas</div>':''}<div class="contact"><span>◎ @beac_hburger</span><span>◉ (22) 99784-9915</span></div></section>`}).join('')||'<div class="empty">Nenhum item ativo no cardápio.</div>'}
async function load(){const r=await fetch('/api/orders?catalog=1',{cache:'no-store'});const d=await r.json();catalog=d.catalog||[];categories=d.categories||[];render()}
document.getElementById('editar').onclick=()=>{editing=!editing;document.getElementById('salvar').classList.toggle('hidden',!editing);document.getElementById('editar').textContent=editing?'Cancelar edição':'✏️ Editar cardápio';render()};
document.getElementById('salvar').onclick=async()=>{const token=localStorage.getItem(TK)||prompt('Informe a senha/token da loja:')||'';const products=[];document.querySelectorAll('.item').forEach(el=>{const p=catalog.find(x=>Number(x.id)===Number(el.dataset.id));products.push({...p,name:el.querySelector('.e-name').value.trim(),description:el.querySelector('.e-desc').value.trim(),price:Number(el.querySelector('.e-price').value||0)})});const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','X-Store-Token':token},body:JSON.stringify({action:'save_catalog',products})});const d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'Não foi possível salvar.');localStorage.setItem(TK,token);catalog=products;editing=false;document.getElementById('salvar').classList.add('hidden');document.getElementById('editar').textContent='✏️ Editar cardápio';render();alert('Cardápio atualizado. As alterações também passam a valer no catálogo do sistema.')};load().catch(()=>document.getElementById('pages').innerHTML='<div class="empty">Não foi possível carregar o cardápio.</div>');
</script></body></html>
