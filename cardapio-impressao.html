<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beach Burguer | Cardápio Editável</title><link rel="icon" href="/assets/logo.png"><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:20;background:#050505;border-bottom:1px solid #333;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar a{border:0;border-radius:9px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.yellow{background:#ffb700;color:#111}.dark{background:#292929;color:#fff}.green{background:#198754;color:#fff}.hint{color:#bbb;font-size:13px}.pages{padding:20px}.page{width:min(210mm,100%);min-height:297mm;margin:0 auto 24px;background:radial-gradient(circle at 80% 15%,#1d1d1d 0,#0d0d0d 30%,#080808 70%);border:1px solid #2c2c2c;position:relative;overflow:hidden;padding:22mm 16mm 20mm;box-shadow:0 8px 30px #000}.page:after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:#ffb700}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title{background:#ffb700;color:#090909;font-size:30px;font-weight:1000;padding:14px 20px;transform:rotate(-4deg);text-transform:uppercase}.logo{width:95px;height:95px;object-fit:contain}.items{display:grid;grid-template-columns:1fr 1fr;gap:24px 48px}.item{position:relative;text-align:center;padding:8px}.name{color:#ffb700;font-weight:1000;font-size:22px;text-transform:uppercase}.desc{font-size:17px;line-height:1.18;white-space:pre-line;margin:7px 0}.price{font-size:22px;font-weight:700}.edit{margin-top:9px;padding-top:8px;border-top:1px dashed #444;text-align:left}.edit label{font-size:11px;color:#bbb}.edit input,.edit textarea{width:100%;background:#161616;color:#fff;border:1px solid #555;border-radius:6px;padding:6px;margin:3px 0 6px}.edit textarea{height:58px;resize:vertical}.foot{text-align:center;margin-top:20px;font-size:17px}.contact{position:absolute;bottom:28px;left:16mm;right:16mm;text-align:center;color:#ffb700;font-weight:800}.category-sub{color:#bbb;text-align:center;margin:-10px 0 25px}.savebar{text-align:center;margin:10px}.empty{text-align:center;color:#aaa;padding:50px}.hidden{display:none!important}@media(max-width:700px){.pages{padding:8px}.page{padding:18px 12px;min-height:0}.items{grid-template-columns:1fr}.title{font-size:22px}.logo{width:70px;height:70px}.contact{position:static;margin-top:35px}}@media print{body{background:#fff}.toolbar,.edit,.savebar{display:none!important}.pages{padding:0}.page{width:210mm;height:297mm;min-height:297mm;margin:0;border:0;box-shadow:none;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}}
</style></head><body><div class="toolbar"><a class="dark" href="/loja">← Pedidos</a><button class="yellow" onclick="window.print()">🖨️ Imprimir / PDF</button><button id="editar" class="dark">✏️ Editar cardápio</button><button id="salvar" class="green hidden">💾 Salvar alterações</button><span class="hint">Artesanais ficam em uma página própria; as demais categorias são separadas mantendo o mesmo visual.</span></div><main id="pages" class="pages"><div class="empty">Carregando cardápio...</div></main><script>
const TK='bb_store_token';let catalog=[],categories=[],editing=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
function isArtesanal(cat){return /artes|tem[aá]tico|lanche/i.test(cat)&&!/tradicional|podr[aã]o|misto|combo|bebida/i.test(cat)}
function render(){const active=catalog.filter(x=>x.active!==false);const order=[...new Set(active.map(x=>x.category))];order.sort((a,b)=>(isArtesanal(b)?1:0)-(isArtesanal(a)?1:0));document.getElementById('pages').innerHTML=order.map(cat=>{const items=active.filter(x=>x.category===cat);const art=isArtesanal(cat);return `<section class="page"><div class="head"><div class="title">${art?'CARDÁPIO DE LANCHES':esc(cat)}</div><img class="logo" src="/assets/logo.png"></div>${art?'':`<div class="category-sub">BEACH BURGUER</div>`}<div class="items">${items.map(p=>`<article class="item" data-id="${p.id}"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'')}</div><div class="price">${money(p.price)}</div><div class="edit ${editing?'':'hidden'}"><label>Nome<input class="e-name" value="${esc(p.name)}"></label><label>Descrição / ingredientes<textarea class="e-desc">${esc(p.description||'')}</textarea></label><label>Preço (R$)<input class="e-price" type="number" step="0.01" min="0" value="${Number(p.price||0).toFixed(2)}"></label></div></article>`).join('')}</div>${art?'<div class="foot">Todos os lanches acompanham fritas</div>':''}<div class="contact">Beach Burguer • (22) 99784-9915</div></section>`}).join('')||'<div class="empty">Nenhum item ativo no cardápio.</div>'}
async function load(){const r=await fetch('/api/orders?catalog=1',{cache:'no-store'});const d=await r.json();catalog=d.catalog||[];categories=d.categories||[];render()}
document.getElementById('editar').onclick=()=>{editing=!editing;document.getElementById('salvar').classList.toggle('hidden',!editing);document.getElementById('editar').textContent=editing?'Cancelar edição':'✏️ Editar cardápio';render()};
document.getElementById('salvar').onclick=async()=>{const token=localStorage.getItem(TK)||prompt('Informe a senha/token da loja:')||'';const products=[];document.querySelectorAll('.item').forEach(el=>{const p=catalog.find(x=>Number(x.id)===Number(el.dataset.id));products.push({...p,name:el.querySelector('.e-name').value.trim(),description:el.querySelector('.e-desc').value.trim(),price:Number(el.querySelector('.e-price').value||0)})});const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','X-Store-Token':token},body:JSON.stringify({action:'save_catalog',products})});const d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'Não foi possível salvar.');localStorage.setItem(TK,token);catalog=products;editing=false;document.getElementById('salvar').classList.add('hidden');document.getElementById('editar').textContent='✏️ Editar cardápio';render();alert('Cardápio atualizado. As alterações também passam a valer no catálogo do sistema.')};load().catch(()=>document.getElementById('pages').innerHTML='<div class="empty">Não foi possível carregar o cardápio.</div>');
</script></body></html>
