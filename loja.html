<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Beach Burguer — Tela de Pedidos</title>
<link rel="icon" href="assets/logo.png">
<style>
:root{--y:#ffb700;--bg:#080808;--p:#151515;--b:#303030;--t:#eee;--g:#25d366;--r:#ff5b5b}
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:20;background:#050505;border-bottom:1px solid var(--b);padding:12px 0}
.container{width:min(1450px,95%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900}.brand img{width:58px;height:58px;object-fit:contain}.brand span{color:var(--y)}
.controls{display:flex;gap:10px;flex-wrap:wrap}button,input{font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.yellow{background:var(--y)}.dark{background:#222;color:white;border:1px solid #444}.green{background:var(--g);color:white}.red{background:var(--r);color:white}
.statusbar{display:flex;gap:10px;flex-wrap:wrap;padding:18px 0}.badge{background:#171717;border:1px solid var(--b);padding:10px 14px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:50px}
.order{background:var(--p);border:1px solid var(--b);border-radius:17px;padding:18px;box-shadow:0 15px 35px rgba(0,0,0,.35)}
.order.novo{border-color:var(--y);box-shadow:0 0 0 2px rgba(255,183,0,.18)}
.order h2{margin:0 0 5px;color:var(--y)}.meta{color:#aaa;font-size:13px}.line{display:flex;justify-content:space-between;gap:12px;margin:8px 0}
.items{border-top:1px solid #333;border-bottom:1px solid #333;margin:14px 0;padding:10px 0}.item{margin:9px 0}.item small{color:#aaa}
.total{font-size:24px;color:var(--y);font-weight:900}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(420px,92%);background:var(--p);border:1px solid var(--b);border-radius:18px;padding:25px}.loginbox input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#0d0d0d;color:white;margin:10px 0}
.hidden{display:none!important}.empty{text-align:center;color:#aaa;padding:80px 20px;grid-column:1/-1}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <div class="brand"><img src="assets/logo.png"><div>BEACH <span>BURGUER</span><br><small>TELA DE PEDIDOS</small></div></div>
    <h2>Entrar</h2>
    <input id="senha" type="password" placeholder="Senha da loja">
    <button id="entrar" class="btn yellow" style="width:100%">ABRIR PEDIDOS</button>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="container top">
    <div class="brand"><img src="assets/logo.png"><div>BEACH <span>BURGUER</span><br><small>Pedidos da loja</small></div></div>
    <div class="controls">
      <button id="somBtn" class="btn dark">🔊 Som ativado</button>
      <button id="autoBtn" class="btn yellow">🖨️ Impressão automática: ON</button>
      <button id="atualizar" class="btn dark">Atualizar</button>
      <button id="sair" class="btn red">Sair</button>
    </div>
  </div>
</header>
<main class="container">
  <div class="statusbar">
    <div class="badge">Novos: <strong id="qNovo">0</strong></div>
    <div class="badge">Em preparo: <strong id="qPreparo">0</strong></div>
    <div class="badge">Prontos: <strong id="qPronto">0</strong></div>
    <div class="badge">Entregues: <strong id="qEntregue">0</strong></div>
  </div>
  <div id="pedidos" class="grid"></div>
</main>
</div>

<script>
const TOKEN_KEY="bb_store_token";
let token=localStorage.getItem(TOKEN_KEY)||"";
let conhecidos=new Set();
let primeiraCarga=true;
let somAtivo=true;
let impressaoAutomatica=true;
let intervalo=null;

const $=id=>document.getElementById(id);
const moeda=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dataHora=v=>new Date(v).toLocaleString("pt-BR");

$("senha").value=token;
$("entrar").onclick=entrar;
$("senha").onkeydown=e=>{if(e.key==="Enter")entrar()};
$("sair").onclick=()=>{localStorage.removeItem(TOKEN_KEY);location.reload()};
$("atualizar").onclick=carregarPedidos;
$("somBtn").onclick=()=>{somAtivo=!somAtivo;$("somBtn").textContent=somAtivo?"🔊 Som ativado":"🔇 Som desativado"};
$("autoBtn").onclick=()=>{impressaoAutomatica=!impressaoAutomatica;$("autoBtn").textContent=`🖨️ Impressão automática: ${impressaoAutomatica?"ON":"OFF"}`};

async function entrar(){
  token=$("senha").value.trim();
  if(!token)return alert("Digite a senha.");
  try{
    await carregarPedidos();
    localStorage.setItem(TOKEN_KEY,token);
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    if(intervalo)clearInterval(intervalo);
    intervalo=setInterval(carregarPedidos,3000);
  }catch(e){alert("Senha incorreta ou conexão indisponível.");}
}

async function api(method,body){
  const options={method,headers:{"Content-Type":"application/json","X-Store-Token":token}};
  if(body)options.body=JSON.stringify(body);
  const res=await fetch("/api/orders",options);
  const data=await res.json();
  if(!res.ok||!data.ok)throw new Error(data.error||"Erro");
  return data;
}

async function carregarPedidos(){
  const data=await api("POST",{action:"list_orders"});
  render(data.orders);

  const novos=data.orders.filter(p=>p.status==="novo"&&!conhecidos.has(p.id));
  if(!primeiraCarga&&novos.length){
    if(somAtivo)tocarSom();
    for(const pedido of novos){
      if(impressaoAutomatica&&!pedido.printed){
        imprimirPedido(pedido);
        await atualizarPedido(pedido.id,{printed:true});
      }
    }
  }
  data.orders.forEach(p=>conhecidos.add(p.id));
  primeiraCarga=false;
}

function tocarSom(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.connect(gain);gain.connect(ctx.destination);
  osc.frequency.value=880;gain.gain.value=.2;osc.start();
  setTimeout(()=>{osc.stop();ctx.close()},700);
}

function render(list){
  $("qNovo").textContent=list.filter(p=>p.status==="novo").length;
  $("qPreparo").textContent=list.filter(p=>p.status==="preparo").length;
  $("qPronto").textContent=list.filter(p=>p.status==="pronto").length;
  $("qEntregue").textContent=list.filter(p=>p.status==="entregue").length;

  $("pedidos").innerHTML=list.length?list.map(p=>`
  <article class="order ${p.status}">
    <h2>Pedido #${p.id}</h2>
    <div class="meta">${dataHora(p.created_at)} • ${String(p.status).toUpperCase()}</div>
    <p><strong>${esc(p.cliente)}</strong><br>${esc(formatPhone(p.telefone))}</p>
    ${p.tipo==="Entrega"?`<p>${esc(p.endereco)}<br>${esc(p.bairro)} — ${esc(p.localidade)}<br><small>Ref.: ${esc(p.referencia||"Não informada")}</small></p>`:`<p><strong>RETIRADA NO LOCAL</strong></p>`}
    <div class="items">${(p.itens||[]).map(i=>`
      <div class="item"><strong>${i.quantidade}x ${esc(i.nome)}</strong> — ${moeda(i.total)}
      ${i.adicionais?.length?`<small><br>+ ${i.adicionais.map(a=>esc(a.nome)).join(", ")}</small>`:""}
      ${i.observacao?`<small><br>Obs.: ${esc(i.observacao)}</small>`:""}</div>`).join("")}</div>
    <div class="line"><span>Pagamento</span><strong>${esc(p.pagamento)}</strong></div>
    ${p.troco?`<div class="line"><span>Troco</span><strong>${esc(p.troco)}</strong></div>`:""}
    <div class="line"><span>Entrega</span><strong>${moeda(p.entrega)}</strong></div>
    <div class="line total"><span>Total</span><strong>${moeda(p.total)}</strong></div>
    ${p.observacoes?`<p><strong>Observações:</strong> ${esc(p.observacoes)}</p>`:""}
    <div class="actions">
      <button class="btn yellow" onclick="imprimirPorId(${p.id})">Imprimir</button>
      <button class="btn dark" onclick="mudarStatus(${p.id},'preparo')">Em preparo</button>
      <button class="btn green" onclick="mudarStatus(${p.id},'pronto')">Pronto</button>
      <button class="btn dark" onclick="mudarStatus(${p.id},'entregue')">Entregue</button>
    </div>
  </article>`).join(""):'<div class="empty">Nenhum pedido recebido.</div>';
  window._pedidos=list;
}

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function formatPhone(v){const n=String(v||"").replace(/\D/g,"");return n.length===11?`(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`:n}
async function atualizarPedido(id,campos){await api("POST",{action:"update",id,...campos})}
async function mudarStatus(id,status){await atualizarPedido(id,{status});await carregarPedidos()}
function imprimirPorId(id){const p=window._pedidos.find(x=>x.id===id);if(p)imprimirPedido(p)}

function imprimirPedido(p){
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Pedido #${p.id}</title>
  <style>@page{size:80mm auto;margin:2mm}body{font-family:monospace;width:74mm;margin:0;color:#000}h1,h2,p{margin:4px 0}.center{text-align:center}.sep{border-top:1px dashed #000;margin:7px 0}.row{display:flex;justify-content:space-between}.big{font-size:18px;font-weight:bold}</style></head><body>
  <div class="center"><h2>BEACH BURGUER</h2><h1>PEDIDO #${p.id}</h1><p>${dataHora(p.created_at)}</p></div>
  <div class="sep"></div><p><b>Cliente:</b> ${esc(p.cliente)}</p><p><b>Telefone:</b> ${esc(formatPhone(p.telefone))}</p><p><b>Tipo:</b> ${esc(p.tipo)}</p>
  ${p.tipo==="Entrega"?`<p><b>Endereço:</b> ${esc(p.endereco)}</p><p><b>Bairro:</b> ${esc(p.bairro)}</p><p><b>Localidade:</b> ${esc(p.localidade)}</p><p><b>Referência:</b> ${esc(p.referencia||"-")}</p>`:""}
  <div class="sep"></div>${(p.itens||[]).map(i=>`<p><b>${i.quantidade}x ${esc(i.nome)}</b> — ${moeda(i.total)}</p>${i.adicionais?.length?`<p>+ ${i.adicionais.map(a=>esc(a.nome)).join(", ")}</p>`:""}${i.observacao?`<p>OBS: ${esc(i.observacao)}</p>`:""}`).join("")}
  <div class="sep"></div><div class="row"><span>Subtotal</span><b>${moeda(p.subtotal)}</b></div><div class="row"><span>Entrega</span><b>${moeda(p.entrega)}</b></div><div class="row big"><span>TOTAL</span><b>${moeda(p.total)}</b></div>
  <p><b>Pagamento:</b> ${esc(p.pagamento)}</p>${p.troco?`<p><b>Troco:</b> ${esc(p.troco)}</p>`:""}${p.observacoes?`<p><b>OBS GERAL:</b> ${esc(p.observacoes)}</p>`:""}
  <div class="sep"></div><p class="center">Seu momento, nosso sabor.</p>
  <script>window.onload=()=>{window.print();setTimeout(()=>window.close(),900)}<\/script></body></html>`;
  const w=window.open("","_blank","width=420,height=700");
  if(!w){alert("Permita pop-ups para imprimir.");return}
  w.document.open();w.document.write(html);w.document.close();
}
</script>
</body>
</html>
